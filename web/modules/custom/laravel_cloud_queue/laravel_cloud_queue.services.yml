parameters:
  # Managed queue names keyed by Drupal queue name, for example
  # { media_entity_thumbnail: media }. Unmapped Drupal queues use the default
  # managed queue. Override in a site services YAML file.
  laravel_cloud_queue.queue_map: {}
  # How many times an item is attempted before it is recorded as a failed job.
  laravel_cloud_queue.max_tries: 4
  # Seconds to wait before the first retry. Doubles with each attempt.
  laravel_cloud_queue.backoff: 1

services:
  # Set $settings['queue_default'] = 'queue.laravel_cloud' to use this backend.
  queue.laravel_cloud:
    class: Drupal\laravel_cloud_queue\Queue\CloudQueueFactory
    arguments: ['@Drupal\laravel_cloud_queue\CloudQueueClient', '@Drupal\laravel_cloud_queue\Metrics']
    tags:
      - { name: queue_factory }

  Drupal\laravel_cloud_queue\CloudQueueClient:
    arguments:
      - '@laravel_cloud_queue.config'
      - '@laravel_cloud_queue.agent'
      - '@uuid'
      - '%laravel_cloud_queue.queue_map%'

  Drupal\laravel_cloud_queue\Metrics:
    arguments: ['@laravel_cloud_queue.config']

  Drupal\laravel_cloud_queue\Worker:
    arguments:
      - '@Drupal\laravel_cloud_queue\CloudQueueClient'
      - '@plugin.manager.queue_worker'
      - '@Drupal\laravel_cloud_queue\Metrics'
      - '@logger.channel.laravel_cloud_queue'
      - '@database'
      - '%laravel_cloud_queue.max_tries%'
      - '%laravel_cloud_queue.backoff%'

  logger.channel.laravel_cloud_queue:
    parent: logger.channel_base
    arguments: ['laravel_cloud_queue']

  # Read from the variables Laravel Cloud injects, when first used.
  laravel_cloud_queue.config:
    class: Laravel\Cloud\Symfony\Queue\ManagedQueueConfig
    factory: ['Drupal\laravel_cloud_queue\CloudQueueClient', 'configFromEnvironment']

  laravel_cloud_queue.agent:
    class: Laravel\Cloud\Symfony\Queue\Agent\AgentClient
    arguments: ['@laravel_cloud_queue.config']
