parameters:
  # Managed queue names keyed by Drupal queue name, for example
  # { media_entity_thumbnail: media }. Unmapped Drupal queues use the default
  # managed queue. Override in a site services YAML file.
  sm_transport_laravel_cloud.queue_map: {}

services:
  Laravel\Cloud\Symfony\Queue\ManagedQueueConfig:
    factory: ['Drupal\sm_transport_laravel_cloud\CloudEnvironment', 'managedQueueConfig']

  Laravel\Cloud\Symfony\Queue\Agent\AgentClient:
    arguments:
      - '@Laravel\Cloud\Symfony\Queue\ManagedQueueConfig'

  Drupal\sm_transport_laravel_cloud\CloudQueueTransportFactory:
    arguments:
      - '@Laravel\Cloud\Symfony\Queue\ManagedQueueConfig'
      - '@Laravel\Cloud\Symfony\Queue\Agent\AgentClient'
    tags:
      - { name: messenger.transport_factory }

  # Emits queue metrics and failed jobs to the Laravel Cloud dashboard.
  Laravel\Cloud\Symfony\Observability\Events:
    factory: ['Drupal\sm_transport_laravel_cloud\CloudEnvironment', 'events']

  Laravel\Cloud\Symfony\Queue\QueueEventSubscriber:
    arguments:
      - '@Laravel\Cloud\Symfony\Observability\Events'
      - '@Laravel\Cloud\Symfony\Queue\ManagedQueueConfig'
    tags:
      - { name: event_subscriber }

  Drupal\sm_transport_laravel_cloud\EventSubscriber\PayloadSizeSubscriber:
    arguments:
      - '@messenger.default_serializer'
    tags:
      - { name: event_subscriber }

  Drupal\sm_transport_laravel_cloud\EventSubscriber\QueueMapSubscriber:
    arguments:
      - '%sm_transport_laravel_cloud.queue_map%'
    tags:
      - { name: event_subscriber }
