services:
  Laravel\Cloud\Symfony\Queue\ManagedQueueConfig:
    factory: ['Drupal\sm_transport_laravel_cloud\CloudEnvironment', 'managedQueueConfig']

  Laravel\Cloud\Symfony\Queue\Sqs\SqsClientFactory:
    arguments:
      - '@Laravel\Cloud\Symfony\Queue\ManagedQueueConfig'

  Laravel\Cloud\Symfony\Queue\Agent\AgentClient:
    arguments:
      - '@Laravel\Cloud\Symfony\Queue\ManagedQueueConfig'

  Laravel\Cloud\Symfony\Queue\Messenger\CloudQueueTransportFactory:
    arguments:
      - '@Laravel\Cloud\Symfony\Queue\ManagedQueueConfig'
      - '@Laravel\Cloud\Symfony\Queue\Sqs\SqsClientFactory'
      - '@Laravel\Cloud\Symfony\Queue\Agent\AgentClient'
    tags:
      - { name: messenger.transport_factory }

  # Emits queue metrics and failed jobs to the Laravel Cloud dashboard.
  Laravel\Cloud\Symfony\Observability\Events:
    factory: ['Drupal\sm_transport_laravel_cloud\CloudEnvironment', 'events']

  Laravel\Cloud\Symfony\Queue\QueueEventSubscriber:
    arguments:
      - '@Laravel\Cloud\Symfony\Observability\Events'
      - '@Laravel\Cloud\Symfony\Queue\ManagedQueueConfig'
    tags:
      - { name: event_subscriber }
